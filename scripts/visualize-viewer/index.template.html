<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE_PLACEHOLDER__</title>
<style>__CSS_PLACEHOLDER__</style>
</head>
<body>

<!-- Scan animation -->
<div id="scan" class="scan">
  <div id="scan-lines"></div>
</div>

<!-- Main content (hidden during scan) -->
<div id="page" class="page hidden">

  <header class="header" data-section-id="_intro">
    <h1 id="page-title"></h1>
    <p id="page-subtitle" class="subtitle"></p>
  <button id="tour-btn" class="tour-start-btn" style="display:none" aria-label="Start guided tour">&#9654; Tour</button>
  </header>

  <!-- Narration player (only shown when narration is embedded) -->
  <div id="narration-player" class="narration-player" style="display:none" role="region" aria-label="Narration player">
    <button id="narr-play" class="narr-btn" aria-label="Play narration" title="Play narration">&#9654;</button>
    <div class="narr-wave" id="narr-wave" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="narr-seek-wrap">
      <input type="range" id="narr-seek" class="narr-seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
    </div>
    <span id="narr-section" class="narr-section-label"></span>
    <span id="narr-time" class="narr-time">0:00&nbsp;/&nbsp;0:00</span>
  </div>

  <div class="layout-wrapper">
    <!-- Side rails (cross-cutting concerns) -->
    <aside id="left-rail" class="side-rail left"></aside>

    <!-- Main layers -->
    <main id="layers" class="layers"></main>

    <!-- Side rails (cross-cutting concerns) -->
    <aside id="right-rail" class="side-rail right"></aside>
  </div>

  <!-- Tour Mode Overlay -->
  <div id="tour-overlay" class="tour-overlay hidden" role="dialog" aria-modal="true" aria-label="Architecture tour">
    <div class="tour-slide">
      <div class="tour-top">
        <span class="tour-progress" id="tour-progress"></span>
        <span class="tour-layer-label" id="tour-layer-label"></span>
      </div>
      <div class="tour-body" id="tour-body"></div>
      <nav class="tour-nav">
        <button class="tour-btn tour-btn-back" id="tour-back" aria-label="Previous slide">&#8592; Back</button>
        <button class="tour-btn tour-btn-exit" id="tour-exit" aria-label="Exit tour">&#215; Exit</button>
        <button class="tour-btn tour-btn-next" id="tour-next" aria-label="Next slide">Next &#8594;</button>
      </nav>
    </div>
  </div>

</div>

<script>
var DATA = "__DATA_PLACEHOLDER__";
var NARRATION = "__NARRATION_PLACEHOLDER__";
</script>
<script>
(function() {
  'use strict';

  // ── Scan animation ──
  (function() {
    var el = document.getElementById('scan-lines');
    var allCards = [];
    (DATA.layers || []).forEach(function(layer) {
      (layer.cards || []).forEach(function(card) { allCards.push(card.title); });
      (layer.columns || []).forEach(function(col) {
        (col.cards || []).forEach(function(card) { allCards.push(card.title); });
      });
    });
    (DATA.side_rails || []).forEach(function(rail) {
      allCards.push(rail.title);
    });

    var lines = [
      { text: '\u25C9 CLAUDEBOOST ARCHITECTURE ANALYZER', cls: 'bright' },
      { text: '', cls: '' },
      { text: '\u25B8 Initializing...', cls: 'dim' },
    ];
    allCards.slice(0, 6).forEach(function(n) {
      lines.push({ text: '\u25B8 Scanning ' + n, cls: 'dim' });
    });
    lines.push({ text: '', cls: '' });
    lines.push({ text: '\u25B8 Mapping architecture...', cls: 'dim' });
    if (NARRATION) {
      lines.push({ text: '\u25B8 Loading narration...', cls: 'dim' });
    }
    lines.push({ text: '', cls: '' });
    lines.push({ text: '\u25C9 READY', cls: 'bright' });

    var i = 0;
    var iv = setInterval(function() {
      if (i >= lines.length) {
        clearInterval(iv);
        setTimeout(function() {
          document.getElementById('scan').classList.add('fade');
          document.getElementById('page').classList.remove('hidden');
          setTimeout(function() {
            document.getElementById('scan').style.display = 'none';
          }, 600);
        }, 500);
        return;
      }
      var div = document.createElement('div');
      div.className = 'scan-line ' + (lines[i].cls || '');
      div.textContent = lines[i].text;
      el.appendChild(div);
      i++;
    }, 200);
  })();

  // ── Helpers ──
  var expandedCard = null;

  function buildCard(card) {
    var el = document.createElement('div');
    el.className = 'card';
    if (card.accent) el.style.borderLeftColor = card.accent;
    if (card.badge) el.classList.add('has-badge');
    el.dataset.id = card.id;

    // Badge
    if (card.badge) {
      var badge = document.createElement('span');
      badge.className = 'card-badge';
      if (card.badge_color) badge.style.background = card.badge_color;
      badge.textContent = card.badge;
      el.appendChild(badge);
    }

    // Top image (shown above title, outside detail panel)
    if (card.image && card.image_position !== 'detail') {
      var img = document.createElement('img');
      img.className = 'card-image';
      img.src = card.image;
      img.alt = card.image_alt || card.title || '';
      el.appendChild(img);
    }

    // Icon
    if (card.icon) {
      var icon = document.createElement('span');
      icon.className = 'card-icon';
      icon.textContent = card.icon;
      el.appendChild(icon);
    }

    var title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = card.title;
    el.appendChild(title);

    if (card.subtitle) {
      var sub = document.createElement('div');
      sub.className = 'card-subtitle';
      sub.textContent = card.subtitle;
      el.appendChild(sub);
    }

    // Detail panel
    var detail = document.createElement('div');
    detail.className = 'card-detail';

    if (card.detail) {
      var p = document.createElement('p');
      p.className = 'detail-text';
      p.textContent = card.detail;
      detail.appendChild(p);
    }

    if (card.responsibilities && card.responsibilities.length) {
      var ul = document.createElement('ul');
      ul.className = 'detail-list';
      card.responsibilities.forEach(function(r) {
        var li = document.createElement('li');
        li.textContent = r;
        ul.appendChild(li);
      });
      detail.appendChild(ul);
    }

    if (card.citations && card.citations.length) {
      var cits = document.createElement('div');
      cits.className = 'detail-citations';
      card.citations.forEach(function(c) {
        var span = document.createElement('span');
        span.className = 'citation';
        span.textContent = c.file + ':' + c.lines;
        if (c.shows) span.textContent += ' \u2014 ' + c.shows;
        span.onclick = function(e) {
          e.stopPropagation();
          navigator.clipboard.writeText(c.file + ':' + c.lines);
          span.classList.add('copied');
          setTimeout(function() { span.classList.remove('copied'); }, 1500);
        };
        cits.appendChild(span);
      });
      detail.appendChild(cits);
    }

    // Detail image (shown inside expanded panel)
    if (card.image && card.image_position === 'detail') {
      var dimgWrap = document.createElement('div');
      dimgWrap.style.marginTop = '12px';
      var dimg = document.createElement('img');
      dimg.className = 'card-image card-image-detail';
      dimg.src = card.image;
      dimg.alt = card.image_alt || card.title || '';
      dimgWrap.appendChild(dimg);
      detail.appendChild(dimgWrap);
    }

    el.appendChild(detail);

    el.addEventListener('click', function(e) {
      e.stopPropagation();
      if (el.classList.contains('expanded')) {
        el.classList.remove('expanded');
        expandedCard = null;
      } else {
        if (expandedCard) expandedCard.classList.remove('expanded');
        el.classList.add('expanded');
        expandedCard = el;
      }
    });

    return el;
  }

  function buildFlowArrow(layer) {
    var arrow = document.createElement('div');
    arrow.className = 'flow-arrow';
    var label = layer.flow_label || '';
    arrow.innerHTML = '<div class="flow-line"></div>' +
      (label ? '<span class="flow-label">' + label + '</span>' : '') +
      '<div class="flow-chevron">\u25BC</div>';
    return arrow;
  }

  function buildExchange(exchange) {
    var el = document.createElement('div');
    el.className = 'exchange';

    var left = buildCard(exchange.left);
    left.classList.add('exchange-card');
    var right = buildCard(exchange.right);
    right.classList.add('exchange-card');

    var arrows = document.createElement('div');
    arrows.className = 'exchange-arrows';
    arrows.innerHTML =
      '<div class="exchange-arrow-row">' +
        '<span class="exchange-label">' + (exchange.request_label || '\u2192') + '</span>' +
        '<span class="exchange-line">\u2192</span>' +
      '</div>' +
      '<div class="exchange-arrow-row reverse">' +
        '<span class="exchange-line">\u2190</span>' +
        '<span class="exchange-label">' + (exchange.response_label || '\u2190') + '</span>' +
      '</div>';

    el.appendChild(left);
    el.appendChild(arrows);
    el.appendChild(right);
    return el;
  }

  function buildDecision(decision) {
    var el = document.createElement('div');
    el.className = 'decision';

    // The question card
    var questionCard = buildCard(decision.question);
    questionCard.classList.add('decision-question');
    el.appendChild(questionCard);

    // Outcomes
    var outcomes = document.createElement('div');
    outcomes.className = 'decision-outcomes';

    (decision.outcomes || []).forEach(function(outcome) {
      var branch = document.createElement('div');
      branch.className = 'decision-branch';
      if (outcome.style === 'success') branch.classList.add('branch-success');
      if (outcome.style === 'failure') branch.classList.add('branch-failure');

      var label = document.createElement('div');
      label.className = 'branch-label';
      label.textContent = outcome.label || '';
      branch.appendChild(label);

      var branchCard = buildCard(outcome);
      branch.appendChild(branchCard);
      outcomes.appendChild(branch);
    });

    el.appendChild(outcomes);
    return el;
  }

  function buildNote(note) {
    var el = document.createElement('div');
    el.className = 'inline-note';
    if (note.style === 'warning') el.classList.add('note-warning');
    if (note.style === 'info') el.classList.add('note-info');
    if (note.style === 'success') el.classList.add('note-success');
    el.innerHTML = (note.icon ? '<span class="note-icon">' + note.icon + '</span>' : '') +
      '<span class="note-text">' + note.text + '</span>';
    return el;
  }

  // ── Build page ──
  document.getElementById('page-title').textContent = DATA.title || DATA.project || 'Architecture';
  document.getElementById('page-subtitle').textContent = DATA.subtitle || '';

  // ── Side rails ──
  (DATA.side_rails || []).forEach(function(rail) {
    var side = rail.side === 'left' ? 'left-rail' : 'right-rail';
    var railEl = document.getElementById(side);

    var card = buildCard(rail);
    card.classList.add('rail-card');
    card.dataset.sectionId = rail.id;
    railEl.appendChild(card);

    railEl.classList.add('visible');
  });

  // ── Main layers ──
  var layersEl = document.getElementById('layers');

  (DATA.layers || []).forEach(function(layer, idx) {
    // Flow arrow between layers
    if (idx > 0 && layer.flow_label) {
      layersEl.appendChild(buildFlowArrow(layer));
    } else if (idx > 0) {
      var spacer = document.createElement('div');
      spacer.className = 'flow-arrow';
      spacer.innerHTML = '<div class="flow-chevron">\u25BC</div>';
      layersEl.appendChild(spacer);
    }

    var section = document.createElement('section');
    section.className = 'layer';
    if (layer.style === 'highlight') section.classList.add('layer-highlight');
    if (layer.id) section.dataset.sectionId = layer.id;

    // Layer header
    var header = document.createElement('div');
    header.className = 'layer-header';
    header.textContent = layer.label || '';
    if (layer.description) {
      var desc = document.createElement('span');
      desc.className = 'layer-desc';
      desc.textContent = ' \u2014 ' + layer.description;
      header.appendChild(desc);
    }
    section.appendChild(header);

    // Columns layout
    if (layer.columns && layer.columns.length) {
      var columnsRow = document.createElement('div');
      columnsRow.className = 'columns-row';

      layer.columns.forEach(function(col, colIdx) {
        if (colIdx > 0) {
          var sep = document.createElement('div');
          sep.className = 'column-separator';
          columnsRow.appendChild(sep);
        }

        var colEl = document.createElement('div');
        colEl.className = 'column';

        if (col.label) {
          var colLabel = document.createElement('div');
          colLabel.className = 'column-label';
          colLabel.textContent = col.label;
          colEl.appendChild(colLabel);
        }

        var colCards = document.createElement('div');
        colCards.className = 'column-cards';
        (col.cards || []).forEach(function(card) {
          colCards.appendChild(buildCard(card));
        });
        colEl.appendChild(colCards);

        columnsRow.appendChild(colEl);
      });

      section.appendChild(columnsRow);
    }

    // Regular cards (flat row)
    if (layer.cards && layer.cards.length) {
      var cardsRow = document.createElement('div');
      cardsRow.className = 'cards-row';
      layer.cards.forEach(function(card) {
        cardsRow.appendChild(buildCard(card));
      });
      section.appendChild(cardsRow);
    }

    // Exchanges (back-and-forth)
    if (layer.exchanges) {
      layer.exchanges.forEach(function(ex) {
        section.appendChild(buildExchange(ex));
      });
    }

    // Decisions (branching)
    if (layer.decisions) {
      layer.decisions.forEach(function(dec) {
        section.appendChild(buildDecision(dec));
      });
    }

    // Notes (inline callouts)
    if (layer.notes) {
      layer.notes.forEach(function(note) {
        section.appendChild(buildNote(note));
      });
    }

    layersEl.appendChild(section);
  });

  // Click outside to collapse
  document.addEventListener('click', function() {
    if (expandedCard) {
      expandedCard.classList.remove('expanded');
      expandedCard = null;
    }
  });

  // ── Narration player ─────────────────────────────────────────────────────
  if (NARRATION) {
    var playerEl = document.getElementById('narration-player');
    playerEl.style.display = 'flex';

    var narrationAudio = new Audio(NARRATION.audio);
    var playBtn = document.getElementById('narr-play');
    var seekEl = document.getElementById('narr-seek');
    var timeEl = document.getElementById('narr-time');
    var sectionLabelEl = document.getElementById('narr-section');
    var activeSection = null;

    function formatMs(ms) {
      var s = Math.floor(ms / 1000);
      var m = Math.floor(s / 60);
      return m + ':' + String(s % 60).padStart(2, '0');
    }

    function findSection(ms) {
      var secs = (NARRATION.timing && NARRATION.timing.sections) || [];
      var found = null;
      for (var i = 0; i < secs.length; i++) {
        if (ms >= secs[i].start_ms) found = secs[i];
      }
      return found;
    }

    function clearHighlights() {
      document.querySelectorAll('.section-active').forEach(function(el) {
        el.classList.remove('section-active');
      });
    }

    function highlightSection(id) {
      if (id === activeSection) return;
      activeSection = id;
      clearHighlights();
      if (!id) return;

      var target;
      if (id === '_intro') {
        target = document.querySelector('[data-section-id="_intro"]');
      } else {
        target = document.querySelector('[data-section-id="' + CSS.escape(id) + '"]');
      }

      if (target) {
        target.classList.add('section-active');
        // Smooth scroll — only if section is out of viewport
        var rect = target.getBoundingClientRect();
        if (rect.top < 0 || rect.bottom > window.innerHeight) {
          target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }
    }

    narrationAudio.addEventListener('timeupdate', function() {
      var ms = narrationAudio.currentTime * 1000;
      var totalMs = NARRATION.timing.total_ms || (narrationAudio.duration * 1000) || 1;
      seekEl.value = (ms / totalMs * 100);
      timeEl.textContent = formatMs(ms) + '\u00a0/\u00a0' + formatMs(totalMs);

      var sec = findSection(ms);
      if (sec) {
        var label = sec.label || sec.id.replace(/^_/, '').replace(/-/g, ' ').toUpperCase();
        sectionLabelEl.textContent = label;
        highlightSection(sec.id);
      }
    });

    narrationAudio.addEventListener('ended', function() {
      playerEl.classList.remove('is-playing');
      playBtn.innerHTML = '&#9654;';
      playBtn.setAttribute('aria-label', 'Play narration');
      clearHighlights();
      activeSection = null;
      sectionLabelEl.textContent = '';
      seekEl.value = 0;
      timeEl.textContent = '0:00\u00a0/\u00a0' + formatMs(NARRATION.timing.total_ms || 0);
    });

    playBtn.addEventListener('click', function() {
      if (narrationAudio.paused) {
        narrationAudio.play();
        playerEl.classList.add('is-playing');
        playBtn.innerHTML = '&#9646;&#9646;';
        playBtn.setAttribute('aria-label', 'Pause narration');
      } else {
        narrationAudio.pause();
        playerEl.classList.remove('is-playing');
        playBtn.innerHTML = '&#9654;';
        playBtn.setAttribute('aria-label', 'Play narration');
      }
    });

    seekEl.addEventListener('input', function() {
      var totalMs = NARRATION.timing.total_ms || (narrationAudio.duration * 1000) || 1;
      narrationAudio.currentTime = (parseFloat(seekEl.value) / 100) * totalMs / 1000;
    });

    // Keyboard: space to play/pause
    document.addEventListener('keydown', function(e) {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        playBtn.click();
      }
    });
  }

  // ── Tour Mode ──────────────────────────────────────────────────────────────
  (function() {
    var tourSlides = [];

    function addSlide(card, layerLabel) {
      if (!card || !card.title) return;
      tourSlides.push({ card: card, layer: layerLabel });
    }

    (DATA.side_rails || []).forEach(function(rail) {
      addSlide(rail, 'Cross-Cutting');
    });

    (DATA.layers || []).forEach(function(layer) {
      var lbl = layer.label || '';
      (layer.cards || []).forEach(function(card) { addSlide(card, lbl); });
      (layer.columns || []).forEach(function(col) {
        (col.cards || []).forEach(function(card) {
          addSlide(card, lbl + (col.label ? ' / ' + col.label : ''));
        });
      });
      (layer.exchanges || []).forEach(function(ex) {
        if (ex.left) addSlide(ex.left, lbl);
        if (ex.right) addSlide(ex.right, lbl);
      });
      (layer.decisions || []).forEach(function(dec) {
        if (dec.question) addSlide(dec.question, lbl);
        (dec.outcomes || []).forEach(function(o) { addSlide(o, lbl); });
      });
    });

    if (!tourSlides.length) return;

    var currentIdx = 0;
    var overlay  = document.getElementById('tour-overlay');
    var tourBody = document.getElementById('tour-body');
    var tourProg = document.getElementById('tour-progress');
    var tourLbl  = document.getElementById('tour-layer-label');
    var tourBack = document.getElementById('tour-back');
    var tourNext = document.getElementById('tour-next');
    var tourExit = document.getElementById('tour-exit');
    var tourBtn  = document.getElementById('tour-btn');

    tourBtn.style.display = '';

    function showSlide(idx) {
      var s = tourSlides[idx];
      var c = s.card;
      var total = tourSlides.length;

      tourProg.textContent = (idx + 1) + ' / ' + total;
      tourLbl.textContent  = s.layer || '';
      tourBack.disabled    = (idx === 0);
      var isLast = (idx === total - 1);
      tourNext.textContent = isLast ? 'Done \u2713' : 'Next \u2192';
      if (isLast) tourNext.classList.add('is-last');
      else tourNext.classList.remove('is-last');

      tourBody.innerHTML = '';

      // Image (top position)
      if (c.image && c.image_position !== 'detail') {
        var wrap = document.createElement('div');
        wrap.className = 'tour-image-wrap';
        var img = document.createElement('img');
        img.src = c.image;
        img.alt = c.image_alt || c.title || '';
        wrap.appendChild(img);
        tourBody.appendChild(wrap);
      }

      // Icon — shown regardless of top image (matches buildCard behaviour)
      if (c.icon) {
        var icon = document.createElement('span');
        icon.className = 'tour-icon-lg';
        icon.textContent = c.icon;
        tourBody.appendChild(icon);
      } else if (!c.image || c.image_position === 'detail') {
        // Fallback monogram when no image and no icon
        var mono = document.createElement('span');
        mono.className = 'tour-icon-lg tour-monogram';
        mono.textContent = (c.title || '?').charAt(0).toUpperCase();
        tourBody.appendChild(mono);
      }

      // Title
      var titleEl = document.createElement('div');
      titleEl.className = 'tour-title';
      titleEl.textContent = c.title;
      tourBody.appendChild(titleEl);

      // Subtitle
      if (c.subtitle) {
        var subEl = document.createElement('div');
        subEl.className = 'tour-subtitle';
        subEl.textContent = c.subtitle;
        tourBody.appendChild(subEl);
      }

      // Accent bar
      var bar = document.createElement('div');
      bar.className = 'tour-accent-bar';
      if (c.accent) bar.style.background = c.accent;
      tourBody.appendChild(bar);

      // Detail text
      if (c.detail) {
        var det = document.createElement('div');
        det.className = 'tour-detail';
        det.textContent = c.detail;
        tourBody.appendChild(det);
      }

      // Image (detail position — after text)
      if (c.image && c.image_position === 'detail') {
        var wrap2 = document.createElement('div');
        wrap2.className = 'tour-image-wrap';
        wrap2.style.marginTop = '16px';
        var img2 = document.createElement('img');
        img2.src = c.image;
        img2.alt = c.image_alt || c.title || '';
        wrap2.appendChild(img2);
        tourBody.appendChild(wrap2);
      }

      // Responsibilities
      if (c.responsibilities && c.responsibilities.length) {
        var ul = document.createElement('ul');
        ul.className = 'tour-list';
        c.responsibilities.forEach(function(r) {
          var li = document.createElement('li');
          li.textContent = r;
          ul.appendChild(li);
        });
        tourBody.appendChild(ul);
      }

      tourBody.scrollTop = 0;
    }

    function openTour(startIdx) {
      currentIdx = (startIdx !== undefined) ? startIdx : 0;
      overlay.classList.remove('hidden');
      try {
        showSlide(currentIdx);
      } catch (e) {
        closeTour();
        return;
      }
      document.body.style.overflow = 'hidden';
      tourNext.focus();
    }

    function closeTour() {
      overlay.classList.add('hidden');
      document.body.style.overflow = '';
      tourBtn.focus();
    }

    tourBtn.addEventListener('click', function() { openTour(0); });
    tourExit.addEventListener('click', closeTour);
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeTour();
    });

    tourBack.addEventListener('click', function() {
      if (currentIdx > 0) { currentIdx--; showSlide(currentIdx); }
    });

    tourNext.addEventListener('click', function() {
      if (currentIdx < tourSlides.length - 1) { currentIdx++; showSlide(currentIdx); }
      else { closeTour(); }
    });

    document.addEventListener('keydown', function(e) {
      if (overlay.classList.contains('hidden')) {
        if ((e.key === 't' || e.key === 'T') && e.target === document.body) { openTour(0); }
        return;
      }
      if (e.key === 'Escape') { e.preventDefault(); closeTour(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); tourNext.click(); }
      else if (e.key === 'ArrowLeft')  { e.preventDefault(); tourBack.click(); }
    });
  })();

})();
</script>
</body>
</html>
