[pytest]
# Keep collection out of directories that are not source.
#
# There was no pytest config at all, so a run from the repo root walked
# everything, including `workspace/`. That directory is gitignored scratch: it
# holds task folders, and at least one abandoned test from July that imports
# `_vacuum_chroma_sqlite` from `server.indexing`, a symbol that no longer
# exists. A collection error there aborts the whole run before a single real
# test executes, which is what `clean-rag/hooks/auto-test-gate.py` kept
# reporting.
#
# Scratch that breaks the test gate is worse than scratch that just sits there,
# because the gate is what tells you a real suite went red.
#
# This does not address `scripts/tests` and `clean-rag/tests` colliding on a
# `tests.conftest` import when run together. That one is a real packaging
# problem with its own entry at
# spec/architecture-changes/tests-three-suites-cannot-run-together.md. Run them
# separately until it is resolved:
#
#     python -m pytest clean-rag/tests
#     python -m pytest scripts/tests
norecursedirs =
    workspace
    .git
    *-venv
    venv
    .venv
    node_modules
    __pycache__
    .rag-index
    databases

addopts = --import-mode=importlib
