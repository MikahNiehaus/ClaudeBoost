[project]
name = "rag-server"
version = "0.1.0"
description = "MCP RAG server for ClaudeBoost - semantic search over knowledge bases and agent definitions"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "chromadb>=0.5",
    "chroma-hnswlib>=0.7.6",
    "sentence-transformers>=3.0",
    "watchdog>=4.0",
    "pathspec>=0.12",
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
    "tree-sitter-ruby",
    "tree-sitter-bash",
    "tree-sitter-lua",
    "tree-sitter-kotlin",
    "tree-sitter-swift",
    "tree-sitter-php",
    "tree-sitter-c-sharp",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pymupdf>=1.24",
    "html2text>=2024.2",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
graph = [
    "graspologic>=3.0",
    "networkx>=3.0",
]
ollama = [
    "ollama>=0.3",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
